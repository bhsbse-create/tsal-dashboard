<style>
:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#EEF0F3;
  --ink:#12161C;
  --muted:#5B6472;
  --border:#DEE2E8;
  --accent:#2E6FDE;
  --accent-ink:#FFFFFF;

  --field-micro:#1C9C8B;
  --field-transit:#2E6FDE;
  --field-newmode:#7B5FD9;
  --field-behavior:#E0A72E;
  --field-infra:#D1495B;
  --field-etc:#8A94A6;

  --status-plan:#2E6FDE;
  --status-draft:#E0A72E;
  --status-review:#7B5FD9;
  --status-published:#1C9C8B;
  --status-transfer:#8A94A6;
  --status-none:#AEB4BF;

  --shadow: 0 1px 2px rgba(18,22,28,0.04), 0 8px 24px -12px rgba(18,22,28,0.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1014;
    --surface:#161A21;
    --surface-2:#1D222B;
    --ink:#E8EAED;
    --muted:#93A0B0;
    --border:#2A3039;
    --accent:#5B8FEF;
    --accent-ink:#0D1014;

    --field-micro:#2DBBA8;
    --field-transit:#5B8FEF;
    --field-newmode:#9B85EB;
    --field-behavior:#F0BF55;
    --field-infra:#E8697C;
    --field-etc:#A6AEBB;

    --status-plan:#5B8FEF;
    --status-draft:#F0BF55;
    --status-review:#9B85EB;
    --status-published:#2DBBA8;
    --status-transfer:#A6AEBB;
    --status-none:#5A616E;

    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1014;
  --surface:#161A21;
  --surface-2:#1D222B;
  --ink:#E8EAED;
  --muted:#93A0B0;
  --border:#2A3039;
  --accent:#5B8FEF;
  --accent-ink:#0D1014;

  --field-micro:#2DBBA8;
  --field-transit:#5B8FEF;
  --field-newmode:#9B85EB;
  --field-behavior:#F0BF55;
  --field-infra:#E8697C;
  --field-etc:#A6AEBB;

  --status-plan:#5B8FEF;
  --status-draft:#F0BF55;
  --status-review:#9B85EB;
  --status-published:#2DBBA8;
  --status-transfer:#A6AEBB;
  --status-none:#5A616E;

  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-family:"IBM Plex Sans",sans-serif;
  text-wrap:balance;
  margin:0;
}
.mono{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
}

/* ---------- password gate ---------- */
.gate{
  position:fixed; inset:0;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  z-index:100;
  padding:20px;
}
.gate-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:32px 28px;
  width:100%;
  max-width:320px;
  text-align:center;
}
.gate-title{
  font-size:20px; font-weight:700; letter-spacing:-0.01em;
}
.gate-sub{
  color:var(--muted); font-size:13px; margin:8px 0 18px;
}
.gate-card input{
  width:100%;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  font-family:inherit;
  margin-bottom:10px;
}
.gate-card input:focus{
  outline:2px solid var(--accent);
  outline-offset:1px;
}
.gate-card button{
  width:100%;
  padding:10px 12px;
  border-radius:8px;
  border:none;
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:600;
  font-size:14px;
  font-family:inherit;
  cursor:pointer;
}
.gate-card button:hover{ filter:brightness(1.05); }
.gate-err{
  color:var(--field-infra);
  font-size:12.5px;
  margin:10px 0 0;
}

/* ---------- layout ---------- */
.app{
  max-width:1180px;
  margin:0 auto;
  padding:28px 20px 60px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px 16px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
  margin-bottom:22px;
  position:relative;
}
.title-row{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.topbar::after{
  content:"";
  position:absolute;
  left:0; bottom:-1px;
  width:64px; height:3px;
  border-radius:3px;
  background:linear-gradient(90deg, var(--accent), var(--field-newmode));
}
.topbar h1{
  font-size:28px;
  font-weight:700;
  letter-spacing:-0.01em;
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(90deg, var(--ink), var(--accent) 140%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.topbar h1 .emoji{
  -webkit-text-fill-color:initial;
  filter:none;
}
.topbar-right{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.updated{
  color:var(--muted);
  font-size:13px;
}
.updated span{
  color:var(--ink);
  font-weight:600;
  margin-left:4px;
}
.guide-btn{
  display:flex;
  align-items:center;
  gap:5px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  padding:6px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
}
.guide-btn:hover{ border-color:var(--muted); color:var(--ink); }
.guide-btn .guide-caret{
  transition:transform .15s ease;
  font-size:11px;
}
.guide-btn.active{
  background:var(--surface-2);
  border-color:var(--accent);
  color:var(--ink);
}
.guide-btn.active .guide-caret{ transform:rotate(180deg); }
.guide-panel{
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:14px;
  padding:16px 20px;
  margin:-8px 0 22px;
  box-shadow:var(--shadow);
}
.guide-panel-title{
  font-weight:700;
  font-size:14px;
  margin-bottom:8px;
}
.guide-panel-body{
  color:var(--muted);
  font-size:13.5px;
  line-height:1.7;
  white-space:pre-line;
}
.all-btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink);
  padding:9px 22px;
  border-radius:999px;
  font-size:14.5px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:background .15s ease, border-color .15s ease, transform .1s ease, color .15s ease;
}
.all-btn .mono{ font-size:14.5px; }
.all-btn:hover{ border-color:var(--muted); transform:translateY(-2px); }
.all-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--accent-ink);
  box-shadow:0 4px 14px -4px color-mix(in srgb, var(--accent) 65%, transparent);
}

section{ margin-bottom:30px; }
section > h2{
  font-size:14px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.06em;
  margin-bottom:12px;
}

/* ---------- status tiles ---------- */
.tiles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
@media (max-width:820px){
  .tiles{ grid-template-columns:repeat(2,1fr); }
}
@media (max-width:480px){
  .tiles{ grid-template-columns:repeat(1,1fr); }
}
.tile{
  background:linear-gradient(160deg, color-mix(in srgb, var(--tile-color,var(--border)) 7%, var(--surface)), var(--surface));
  border:1px solid var(--border);
  border-left:5px solid var(--tile-color,var(--border));
  border-radius:14px;
  padding:20px 20px 18px;
  cursor:pointer;
  text-align:left;
  font-family:inherit;
  color:var(--ink);
  transition:box-shadow .15s ease, transform .15s ease, background .15s ease;
}
.tile:hover{ box-shadow:var(--shadow); transform:translateY(-2px); }
.tile.active{
  box-shadow:0 0 0 2px var(--tile-color,var(--accent)) inset, var(--shadow);
  background:color-mix(in srgb, var(--tile-color,var(--accent)) 12%, var(--surface-2));
  transform:translateY(-2px);
}
.tile-count{
  font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-size:34px;
  font-weight:600;
  line-height:1.1;
}
.tile-label{
  font-size:14px;
  color:var(--muted);
  margin-top:6px;
}

/* ---------- filters ---------- */
.filter-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px 8px;
  margin-bottom:10px;
}
.filter-label{
  font-size:12.5px;
  font-weight:600;
  color:var(--muted);
  width:52px;
  flex-shrink:0;
}
.pills{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}
.pill{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink);
  padding:6px 13px;
  border-radius:999px;
  font-size:13px;
  font-family:inherit;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:background .15s ease, border-color .15s ease;
}
.pill:hover{ border-color:var(--muted); transform:translateY(-1px); }
.pill{ transition:background .15s ease, border-color .15s ease, transform .1s ease; }
.pill .dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--dot-color,var(--muted));
  flex-shrink:0;
}
.pill.active{
  background:var(--pill-color,var(--accent));
  border-color:var(--pill-color,var(--accent));
  color:var(--accent-ink);
  box-shadow:0 2px 8px -2px color-mix(in srgb, var(--pill-color,var(--accent)) 60%, transparent);
}
.pill.active .dot{ background:var(--accent-ink); }
.reset-btn{
  background:none;
  border:none;
  color:var(--accent);
  font-size:12.5px;
  font-family:inherit;
  cursor:pointer;
  padding:2px 0;
  text-decoration:underline;
  text-underline-offset:2px;
}

/* ---------- results panel ---------- */
.results{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:6px 0;
  box-shadow:var(--shadow);
}
.results-head{
  padding:14px 18px 8px;
  font-size:13px;
  color:var(--muted);
}
.results-head b{
  color:var(--ink);
  font-family:"IBM Plex Mono",monospace;
}
.results-columns{
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 18px 8px;
  border-bottom:1px solid var(--border);
}
.col-spacer-author{ flex:0 0 96px; }
.col-spacer-topic{ flex:1 1 auto; }
.col-head{
  flex:0 0 58px;
  font-size:10.5px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.03em;
  text-align:center;
}
.col-head-status{
  flex:0 0 128px;
  font-size:10.5px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.03em;
  text-align:center;
}
.col-head-related{
  flex:0 0 74px;
  font-size:10.5px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.03em;
  text-align:center;
}
.results-list{
  max-height:420px;
  overflow-y:auto;
}
.result-wrap{
  border-bottom:1px solid var(--border);
}
.result-wrap:last-child{ border-bottom:none; }
.result-row{
  display:flex;
  align-items:baseline;
  gap:14px;
  padding:12px 18px;
  transition:background .12s ease;
}
.result-row:hover{ background:var(--surface-2); }
.result-related{
  flex:0 0 74px;
  text-align:center;
}
.related-btn{
  position:relative;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--accent);
  padding:3px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  white-space:nowrap;
  transition:background .12s ease, border-color .12s ease, color .12s ease;
}
.related-btn:hover{ border-color:var(--accent); }
.related-btn.active{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
}
.related-new-dot{
  position:absolute;
  top:-5px;
  right:-5px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--field-infra);
  color:#fff;
  font-size:9.5px;
  font-weight:700;
  line-height:14px;
  text-align:center;
  box-shadow:0 0 0 2px var(--surface);
}
.related-item-new{
  display:inline-block;
  margin-left:6px;
  padding:1px 6px;
  border-radius:999px;
  background:var(--field-infra);
  color:#fff;
  font-size:9.5px;
  font-weight:700;
  vertical-align:middle;
}
.related-panel{
  padding:2px 18px 14px 110px;
  background:var(--surface-2);
}
.related-item{
  padding:7px 0;
  border-top:1px solid var(--border);
}
.related-item:first-child{ border-top:none; }
.related-item a{
  color:var(--ink);
  font-size:12.5px;
  font-weight:600;
  text-decoration:none;
}
.related-item a:hover{ text-decoration:underline; color:var(--accent); }
.related-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}
.related-empty{
  padding:10px 0;
  color:var(--muted);
  font-size:12.5px;
}
.result-author{
  flex:0 0 96px;
  font-weight:600;
  font-size:13.5px;
}
.result-topic{
  flex:1 1 auto;
  font-size:13.5px;
  color:var(--muted);
  min-width:0;
}
.result-col{
  flex:0 0 58px;
  font-size:14px;
  text-align:center;
}
.result-status{
  flex:0 0 128px;
  text-align:center;
}
.status-badge{
  display:inline-block;
  max-width:100%;
  padding:3px 9px;
  border-radius:999px;
  font-size:10.5px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  vertical-align:middle;
  font-family:"IBM Plex Mono",monospace;
}
.results-empty{
  padding:36px 18px;
  text-align:center;
  color:var(--muted);
  font-size:13.5px;
}

/* ---------- journal chart ---------- */
.chart{
  display:flex;
  align-items:flex-end;
  gap:20px;
  height:150px;
  padding:10px 10px 0;
  border-bottom:1px solid var(--border);
  cursor:default;
}
.chart-single{
  height:110px;
  max-width:180px;
}
.bar-col{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  height:100%;
  cursor:pointer;
}
.bar-value{
  font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}
.bar{
  width:100%;
  max-width:56px;
  border-radius:6px 6px 0 0;
  background:linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 65%, var(--field-newmode)));
  min-height:3px;
  transition:opacity .15s ease, transform .15s ease;
  transform-origin:bottom;
}
.bar-col.active .bar{ opacity:1; box-shadow:0 0 0 2px var(--ink) inset; }
.bar-col:not(.active):hover .bar{ opacity:0.8; transform:scaleX(1.06); }
.bar-label{
  font-size:11.5px;
  color:var(--muted);
  margin-top:8px;
  text-align:center;
}
h3{
  font-size:12.5px;
  font-weight:600;
  color:var(--muted);
  margin:22px 0 10px;
}
</style>

<script>
(function(){
  "use strict";

    {kr:"김성아", en:"Seong-A Seren Kim"},
    {kr:"고건우", en:"Keonwoo Koh"},
    {kr:"양윤철", en:"Yuncheol Yang"},
    {kr:"허창준", en:"Changjun Heo"},
    {kr:"최성택", en:"Sungtaek Choi"},
    {kr:"김준구", en:"Jungu Kim"},
    {kr:"서영운", en:"Youngwoon Seo"},
    {kr:"김우경", en:"Wookyung Kim"}
  ];

  var STATUS_META = [
    {key:"기획",         color:"var(--status-plan)",      match:function(s){ return s === "In-progress"; }},
    {key:"작성중",       color:"var(--status-draft)",     match:function(s){ return s === "In preparation"; }},
    {key:"심사중",       color:"var(--status-review)",    match:function(s){ return ["Round 1","Round 2","Round 3","Round 4+"].indexOf(s) !== -1; }},
    {key:"게재",         color:"var(--status-published)", match:function(s){ return s === "게재 完"; }},
    {key:"논문 Transfer",color:"var(--status-transfer)",  match:function(s){ return s === "논문 Transfer"; }},
    {key:"선택하지않음",  color:"var(--status-none)",      match:function(s){ return !s || s === "선택하지 않음"; }}
  ];

  var JOURNAL_LIST = ["Transport Policy","HKSTS","ITS","대한교통학회","Cities"];

  function bucketOf(status){
    for (var i = 0; i < STATUS_META.length; i++){
      if (STATUS_META[i].match(status)) return STATUS_META[i].key;
    }
    return "선택하지않음";
  }

  // 심사중(Round 1~4+)은 라운드가 커질수록 같은 계열 색을 점점 진하게 만든다.
  function colorFor(status){
    var base = STATUS_META.filter(function(s){ return s.key === bucketOf(status); })[0].color;
    var m = /^Round (\d)\+?$/.exec(status || "");
    if (!m) return base;
    var step = (Math.min(Number(m[1]), 4) - 1) * 18; // Round1:0%, 2:18%, 3:36%, 4+:54%
    // 검정 대신 --ink로 섞으면 라이트 테마에선 더 짙게, 다크 테마에선 더 밝게
    // 이동해서 배경(라이트=밝음/다크=어두움)과의 대비가 항상 커지는 방향으로 진해진다.
    return step === 0 ? base : "color-mix(in srgb, " + base + " " + (100 - step) + "%, var(--ink) " + step + "%)";
  }

  var state = { field:"all", author:"all", status:null, journal:null };

  function matches(p){
    if (state.field !== "all" && p.field !== state.field) return false;
    if (state.author !== "all" && p.engAuthors.indexOf(state.author) === -1) return false;
    if (state.status !== null && bucketOf(p.status) !== state.status) return false;
    if (state.journal !== null){
      if (state.journal === "기타"){ if (p.journals.length !== 0) return false; }
      else if (p.journals.indexOf(state.journal) === -1) return false;
    }
    return true;
  }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderTiles(){
    document.getElementById("all-status-btn").classList.toggle("active", state.status === null);
    document.getElementById("all-count").textContent = DATA.length;
    var wrap = document.getElementById("tiles");
    wrap.innerHTML = "";
    STATUS_META.forEach(function(s){
      var count = DATA.filter(function(p){ return bucketOf(p.status) === s.key; }).length;
      var btn = el("button", "tile" + (state.status === s.key ? " active" : ""));
      btn.style.setProperty("--tile-color", s.color);
      btn.appendChild(el("div", "tile-count mono", String(count)));
      btn.appendChild(el("div", "tile-label", s.key));
      btn.addEventListener("click", function(){
        state.status = (state.status === s.key) ? null : s.key;
        renderAll();
      });
      wrap.appendChild(btn);
    });
  }

  function renderFieldPills(){
    var wrap = document.getElementById("field-pills");
    wrap.innerHTML = "";
    var all = el("button", "pill" + (state.field === "all" ? " active" : ""), "전체");
    all.addEventListener("click", function(){ state.field = "all"; renderAll(); });
    wrap.appendChild(all);
    FIELD_META.forEach(function(f){
      var active = state.field === f.value;
      var btn = el("button", "pill" + (active ? " active" : ""));
      if (active) btn.style.setProperty("--pill-color", f.color);
      var dot = el("span", "dot");
      dot.style.setProperty("--dot-color", f.color);
      btn.appendChild(dot);
      btn.appendChild(document.createTextNode(f.label));
      btn.addEventListener("click", function(){
        state.field = (state.field === f.value) ? "all" : f.value;
        renderAll();
      });
      wrap.appendChild(btn);
    });
  }

  function renderAuthorPills(){
    var wrap = document.getElementById("author-pills");
    wrap.innerHTML = "";
    var all = el("button", "pill" + (state.author === "all" ? " active" : ""), "전체");
    all.addEventListener("click", function(){ state.author = "all"; renderAll(); });
    wrap.appendChild(all);
    AUTHOR_LIST.forEach(function(a){
      var active = state.author === a.en;
      var btn = el("button", "pill" + (active ? " active" : ""), a.kr);
      btn.addEventListener("click", function(){
        state.author = (state.author === a.en) ? "all" : a.en;
        renderAll();
      });
      wrap.appendChild(btn);
    });
  }

  function renderResults(){
    var filtered = DATA.filter(matches);
    document.getElementById("results-count").textContent = filtered.length;
    var list = document.getElementById("results-list");
    list.innerHTML = "";
    if (filtered.length === 0){
      list.appendChild(el("div", "results-empty", "조건에 맞는 논문이 없습니다."));
      return;
    }
    filtered.forEach(function(p){
      var wrap = el("div", "result-wrap");
      var row = el("div", "result-row");
      row.appendChild(el("div", "result-author", p.title));
      row.appendChild(el("div", "result-topic", p.topic || "—"));

      var relatedWrap = el("div", "result-related");
      var relatedBtn = el("button", "related-btn", "관련");
      if (p.relatedHasRecent){
        relatedBtn.appendChild(el("span", "related-new-dot", "!"));
      }
      relatedWrap.appendChild(relatedBtn);
      row.appendChild(relatedWrap);

      var statusColor = colorFor(p.status);
      var statusWrap = el("div", "result-status");
      var badge = el("span", "status-badge", p.status || "선택하지 않음");
      badge.style.background = "color-mix(in srgb, " + statusColor + " 16%, var(--surface))";
      badge.style.color = statusColor;
      badge.style.border = "1px solid color-mix(in srgb, " + statusColor + " 45%, transparent)";
      statusWrap.appendChild(badge);
      row.appendChild(statusWrap);

      row.appendChild(el("div", "result-col", p.presented ? "🙋" : ""));
      row.appendChild(el("div", "result-col", p.awarded ? "👑" : ""));
      wrap.appendChild(row);

      var panel = el("div", "related-panel");
      panel.hidden = true;
      wrap.appendChild(panel);

      var opened = false;
      relatedBtn.addEventListener("click", function(){
        opened = !opened;
        panel.hidden = !opened;
        relatedBtn.classList.toggle("active", opened);
        if (opened && !panel.dataset.built){
          panel.dataset.built = "1";
          // API가 sort=publicationDate:desc를 요청해도 실제로는 연도가 섞여
          // 오는 경우가 있어(2026-09-14 확인) 여기서도 다시 한번 최신순으로
          // 정렬한다.
          var items = (p.related || []).slice().sort(function(a, b){
            var ad = a.publicationDate || (a.year ? a.year + "-01-01" : "0000-00-00");
            var bd = b.publicationDate || (b.year ? b.year + "-01-01" : "0000-00-00");
            return bd < ad ? -1 : bd > ad ? 1 : 0;
          });
          if (items.length === 0){
            panel.appendChild(el("div", "related-empty", "관련 최신 논문을 찾지 못했습니다."));
          } else {
            items.forEach(function(r){
              var item = el("div", "related-item");
              var a = document.createElement("a");
              a.href = r.url;
              a.target = "_blank";
              a.rel = "noopener";
              a.textContent = r.title;
              item.appendChild(a);

              var isRecentItem = false;
              if (r.publicationDate){
                var days = (Date.now() - new Date(r.publicationDate).getTime()) / 86400000;
                isRecentItem = days >= 0 && days <= 30;
              }
              if (isRecentItem){
                item.appendChild(el("span", "related-item-new", "NEW"));
              }

              item.appendChild(el("div", "related-meta", [r.venue, r.publicationDate || r.year].filter(Boolean).join(" · ")));
              panel.appendChild(item);
            });
          }
        }
      });

      list.appendChild(wrap);
    });
  }

  function renderChart(containerId, entries, activeKey, onClick, scaleMax){
    var wrap = document.getElementById(containerId);
    wrap.innerHTML = "";
    entries.forEach(function(entry){
      var col = el("div", "bar-col" + (activeKey === entry.key ? " active" : ""));
      col.appendChild(el("div", "bar-value mono", String(entry.count)));
      var bar = el("div", "bar");
      var pct = scaleMax > 0 ? Math.max((entry.count / scaleMax) * 100, entry.count > 0 ? 4 : 0) : 0;
      bar.style.height = pct + "%";
      col.appendChild(bar);
      col.appendChild(el("div", "bar-label", entry.key));
      col.addEventListener("click", function(){ onClick(entry.key); });
      wrap.appendChild(col);
    });
  }

  function renderJournalCharts(){
    var journalCounts = JOURNAL_LIST.map(function(j){
      return { key:j, count: DATA.filter(function(p){ return p.journals.indexOf(j) !== -1; }).length };
    });
    var otherCount = DATA.filter(function(p){ return p.journals.length === 0; }).length;
    var scaleMax = Math.max.apply(null, journalCounts.map(function(e){ return e.count; }).concat([otherCount, 1]));

    renderChart("journal-chart", journalCounts, state.journal, function(key){
      state.journal = (state.journal === key) ? null : key;
      renderAll();
    }, scaleMax);

    renderChart("other-chart", [{key:"기타", count: otherCount}], state.journal, function(key){
      state.journal = (state.journal === "기타") ? null : "기타";
      renderAll();
    }, scaleMax);
  }

  function renderAll(){
    renderTiles();
    renderFieldPills();
    renderAuthorPills();
    renderResults();
    renderJournalCharts();
  }

  document.getElementById("reset-btn").addEventListener("click", function(){
    state = { field:"all", author:"all", status:null, journal:null };
    renderAll();
  });

  document.getElementById("all-status-btn").addEventListener("click", function(){
    state = { field:"all", author:"all", status:null, journal:null };
    renderAll();
  });

  document.getElementById("updated-date").textContent = UPDATED_AT;

  document.getElementById("guide-btn").addEventListener("click", function(){
    var btn = document.getElementById("guide-btn");
    var panel = document.getElementById("guide-panel");
    var willOpen = panel.hidden;
    panel.hidden = !willOpen;
    btn.classList.toggle("active", willOpen);
    btn.setAttribute("aria-expanded", String(willOpen));
  });

  var UNLOCK_TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7일

  function unlock(remember){
    document.getElementById("gate").hidden = true;
    document.getElementById("app").hidden = false;
    if (remember){
      try { localStorage.setItem("tsal_unlocked_at", String(Date.now())); } catch(e){}
    }
    renderAll();
  }

  document.getElementById("gate-btn").addEventListener("click", function(){
    var v = document.getElementById("gate-input").value;
    if (v === PASSWORD){
      unlock(true);
    } else {
      document.getElementById("gate-err").hidden = false;
    }
  });
  document.getElementById("gate-input").addEventListener("keydown", function(e){
    if (e.key === "Enter") document.getElementById("gate-btn").click();
  });

  try {
    var unlockedAt = Number(localStorage.getItem("tsal_unlocked_at"));
    if (unlockedAt && (Date.now() - unlockedAt) < UNLOCK_TTL_MS) unlock(false);
  } catch(e){}
})();
</script>

</body></html>
